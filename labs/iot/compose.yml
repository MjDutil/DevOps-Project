services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:${MQTT_LAB_PORT:-18883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./.runtime/passwords:/mosquitto/config/passwords:ro
      - dados_mqtt:/mosquitto/data
volumes:
  dados_mqtt:
