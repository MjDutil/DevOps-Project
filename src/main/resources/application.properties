spring.application.name=TDD

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tdd}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# B1 D3 — serviço opcional de IA, remoto ou via Docker Compose
ia.base-url=${IA_BASE_URL:http://localhost:8000}

# D4 — opcional, melhor esforço; sincrono somente para comparação no laboratório
notificacoes.habilitadas=${NOTIFICACOES_HABILITADAS:false}
notificacoes.modo=${NOTIFICACOES_MODO:assincrono}
notificacoes.url=${NOTIFICACOES_URL:http://127.0.0.1:8091}
notificacoes.fila-capacidade=${NOTIFICACOES_FILA_CAPACIDADE:16}

# D6: sem exposição HTTP/JMX de gerenciamento fora do perfil explícito de laboratório.
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
management.metrics.use-global-registry=false
