version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tdd-postgres
    environment:
      POSTGRES_DB: tdd
      POSTGRES_USER: tdd
      POSTGRES_PASSWORD: tdd123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdd -d tdd"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tdd-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tdd.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdd-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tdd
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: tdd
      SPRING_DATASOURCE_PASSWORD: tdd123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
